<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Metadata Viewer</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --text: #1a1d21; --muted: #6b7280; --line: #e5e7eb;
    --accent: #0b8de3; --chip: #eef2f7; --shadow: 0 1px 3px rgba(0,0,0,.08);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --panel: #1a1f26; --text: #e6e8eb; --muted: #9aa3ad; --line: #2a313a; --chip: #232a33; --shadow: 0 1px 3px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  button, select, input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
  button { cursor: pointer; }
  input[type=search] { min-width: 200px; flex: 1; }
  .stats { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 54px); }
  aside { border-right: 1px solid var(--line); padding: 12px; background: var(--panel); overflow-y: auto; position: sticky; top: 54px; height: calc(100vh - 54px); }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 8px 0; }
  .creator { display: flex; justify-content: space-between; gap: 6px; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; }
  .creator:hover, .creator.active { background: var(--chip); }
  .creator .n { color: var(--muted); font-size: 12px; }
  main { padding: 16px; }
  .empty { max-width: 560px; margin: 60px auto; text-align: center; color: var(--muted); }
  .empty code { background: var(--chip); padding: 2px 6px; border-radius: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .card-head .who { font-weight: 600; }
  .card-head .when { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .badge.post { color: #0b8de3; } .badge.message { color: #16a34a; } .badge.story { color: #d97706; }
  .text { padding: 10px 12px; white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: hidden; position: relative; }
  .text.open { max-height: none; }
  .text.clamped::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(transparent, var(--panel)); }
  .more { border: 0; background: transparent; color: var(--accent); padding: 0 12px 8px; font-size: 12px; text-align: left; }
  .media { display: grid; gap: 3px; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); padding: 0 12px 12px; }
  .media.single { grid-template-columns: 1fr; }
  .tile { position: relative; aspect-ratio: 1; background: var(--chip); border-radius: 6px; overflow: hidden; cursor: pointer; }
  .media.single .tile { aspect-ratio: auto; max-height: 420px; }
  .tile img, .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media.single .tile img, .media.single .tile video { object-fit: contain; background: #000; }
  .tile .tag { position: absolute; left: 6px; bottom: 6px; font-size: 10px; padding: 2px 5px; border-radius: 4px; background: rgba(0,0,0,.6); color: #fff; }
  .tile.missing { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; text-align: center; padding: 6px; cursor: default; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 8px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .meta b { color: var(--text); font-weight: 600; }
  .loadmore { display: block; margin: 20px auto; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 50; }
  #lightbox.open { display: flex; }
  #lightbox img, #lightbox video { max-width: 96vw; max-height: 96vh; }
  #lightbox .close { position: absolute; top: 14px; right: 18px; color: #fff; font-size: 28px; background: transparent; border: 0; }
  #lightbox .nav { position: absolute; top: 50%; transform: translateY(-50%); color: #fff; font-size: 34px; background: rgba(0,0,0,.35); border: 0; width: 52px; height: 72px; border-radius: 8px; }
  #lightbox .nav:hover { background: rgba(255,255,255,.18); }
  #lightbox .prev { left: 12px; } #lightbox .next { right: 12px; }
  #lightbox .caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px; color: #ddd; font-size: 12px; background: linear-gradient(transparent, rgba(0,0,0,.7)); pointer-events: none; }
  #lightbox .caption b { color: #fff; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .creators { display: flex; flex-wrap: wrap; gap: 4px; }
    .creator { width: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>Metadata Viewer</h1>
  <button class="primary" id="pick">Open output folder</button>
  <button id="reopen" hidden></button>
  <input type="file" id="pickFallback" webkitdirectory directory multiple hidden />
  <select id="type">
    <option value="">All types</option>
    <option value="post">Posts</option>
    <option value="message">Messages</option>
    <option value="story">Stories</option>
  </select>
  <select id="sort">
    <option value="desc">Newest first</option>
    <option value="asc">Oldest first</option>
    <option value="likes">Most liked</option>
  </select>
  <select id="has">
    <option value="">Any media</option>
    <option value="photo">Has photos</option>
    <option value="video">Has videos</option>
    <option value="missing">Has missing media</option>
    <option value="locked">Has locked media</option>
    <option value="filtered">Has filtered media</option>
    <option value="failed">Has failed media</option>
  </select>
  <input type="search" id="q" placeholder="Search text…" />
  <span class="stats" id="stats"></span>
</header>

<div class="layout">
  <aside>
    <h2>Creators</h2>
    <div class="creators" id="creators"></div>
  </aside>
  <main>
    <div class="empty" id="empty">
      <p>Open the download folder that contains the creator directories, i.e. the folder holding <code>creator/metadata/…</code>.</p>
      <p>Nothing is uploaded. Files are read directly from disk in your browser. The folder you pick is remembered for next time.</p>
    </div>
    <div class="grid" id="grid"></div>
    <button class="loadmore" id="loadmore" hidden>Load more</button>
  </main>
</div>

<div id="lightbox"><button class="close" aria-label="Close">×</button><button class="nav prev" aria-label="Previous">‹</button><button class="nav next" aria-label="Next">›</button><div id="lightboxBody"></div><div class="caption" id="lightboxCaption"></div></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const PAGE = 48;
  const REASONS = { locked: "Locked (not purchased)", not_ready: "Still processing", no_source_url: "No file URL", filtered_or_rejected: "No task recorded (unknown stage)", media_type_filter: "Excluded by media type filter", response_type_filter: "Excluded by response type filter", date_range_filter: "Excluded by date range", min_file_size: "Below minimum file size", duplicate_media_id: "Same file saved under another post", unknown: "Not downloaded" };
  let posts = [];          // normalised metadata docs
  let filtered = [];
  let shown = 0;
  let activeCreator = "";
  let resolver = null;     // (path) => Promise<File|null>
  let lbItems = [];        // every on-disk media item in the current filtered order
  let lbIndex = -1;
  const lbIndexByPath = new Map();
  const urlCache = new Map(); // abs path -> object URL

  // ---------- folder access ----------
  $("#pick").addEventListener("click", async () => {
    if (typeof window.showDirectoryPicker === "function") {
      try {
        const root = await window.showDirectoryPicker({ mode: "read" });
        await loadFromHandle(root);
        await rememberHandle(root);
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
        console.warn("Directory picker failed, falling back to file input", e);
      }
    }
    $("#pickFallback").click();
  });
  $("#pickFallback").addEventListener("change", (e) => loadFromFileList(e.target.files));

  // ---------- remember the last folder (directory handle in IndexedDB) ----------
  const DB = "ofdl-viewer", STORE = "handles", KEY = "lastRoot";
  function idb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbGet() {
    try {
      const db = await idb();
      return await new Promise((res, rej) => {
        const t = db.transaction(STORE, "readonly").objectStore(STORE).get(KEY);
        t.onsuccess = () => res(t.result || null);
        t.onerror = () => rej(t.error);
      });
    } catch { return null; }
  }
  async function idbSet(v) {
    try {
      const db = await idb();
      await new Promise((res, rej) => {
        const t = db.transaction(STORE, "readwrite").objectStore(STORE).put(v, KEY);
        t.onsuccess = () => res();
        t.onerror = () => rej(t.error);
      });
    } catch (e) { console.warn("Could not remember folder", e); }
  }
  async function rememberHandle(h) {
    await idbSet(h);
    showReopen(h);
  }
  function showReopen(h) {
    const b = $("#reopen");
    b.textContent = "Reopen " + (h.name || "last folder");
    b.hidden = false;
    b.onclick = async () => {
      try {
        let perm = await h.queryPermission({ mode: "read" });
        if (perm !== "granted") perm = await h.requestPermission({ mode: "read" });
        if (perm !== "granted") return;
        await loadFromHandle(h);
      } catch (e) {
        console.warn("Reopen failed", e);
        b.textContent = "Last folder unavailable";
      }
    };
  }
  (async () => {
    const h = await idbGet();
    if (!h || typeof h.queryPermission !== "function") return;
    showReopen(h);
    // if Chrome still holds the permission from this session, load without a click
    try { if ((await h.queryPermission({ mode: "read" })) === "granted") await loadFromHandle(h); } catch {}
  })();

  async function loadFromHandle(root) {
    const docs = [];
    async function walk(dir, segs) {
      for await (const [name, h] of dir.entries()) {
        if (h.kind === "directory") {
          // only descend into creator/ and creator/metadata/**; media folders are resolved lazily
          if (segs.length === 0 || segs[segs.length - 1] === "metadata" || segs.includes("metadata")) await walk(h, [...segs, name]);
          else if (segs.length === 1 && name === "metadata") await walk(h, [...segs, name]);
        } else if (segs.includes("metadata") && name.toLowerCase().endsWith(".json")) {
          docs.push({ path: [...segs, name].join("/"), handle: h });
        }
      }
    }
    await walk(root, []);
    resolver = async (path) => {
      try {
        const segs = path.split("/").filter(Boolean);
        const name = segs.pop();
        let d = root;
        for (const s of segs) d = await d.getDirectoryHandle(s);
        return await (await d.getFileHandle(name)).getFile();
      } catch { return null; }
    };
    await ingest(docs);
  }

  async function loadFromFileList(list) {
    const files = new Map();
    const docs = [];
    for (const f of list) {
      const rel = (f.webkitRelativePath || f.name).split("/").slice(1).join("/"); // drop the picked root name
      files.set(rel, f);
      if (rel.split("/").includes("metadata") && rel.toLowerCase().endsWith(".json")) docs.push({ path: rel, handle: { getFile: async () => f } });
    }
    resolver = async (path) => files.get(path) || null;
    await ingest(docs);
  }

  // ---------- parsing ----------
  function normalise(path, doc) {
    const dir = path.split("/").slice(0, -1);
    const media = (doc.media || []).map((m) => ({
      id: String(m.id ?? ""),
      type: m.type || "",
      status: m.status || "",
      reason: m.reason || "",
      duplicateOfPost: m.duplicateOfPost || "",
      width: m.width, height: m.height, duration: m.duration,
      abs: m.path ? resolveRelative(dir, m.path) : null,
    }));
    const when = doc.postedAt ? new Date(doc.postedAt) : null;
    return {
      id: String(doc.id ?? path),
      type: doc.type || "post",
      creator: (doc.creator && (doc.creator.username || doc.creator.name)) || dir[0] || "unknown",
      creatorName: doc.creator && doc.creator.name,
      when, whenMs: when && !isNaN(when) ? when.getTime() : 0,
      text: doc.text || "",
      price: doc.price, isFree: doc.isFree,
      likes: doc.likesCount ?? 0, comments: doc.commentsCount ?? 0, tips: doc.tipsAmount,
      media,
      hasPhoto: media.some((m) => m.abs && /photo|image|gif/.test(m.type)),
      hasVideo: media.some((m) => m.abs && /video|audio/.test(m.type)),
      hasMissing: media.some((m) => !m.abs),
      hasLocked: media.some((m) => m.reason === "locked"),
      hasFiltered: media.some((m) => /filtered_or_rejected|no_source_url|_filter$|min_file_size|duplicate_media_id/.test(m.reason)),
      hasFailed: media.some((m) => /failed|canceled|skipped_drm/.test(m.status)),
      path,
    };
  }
  function resolveRelative(dirSegs, rel) {
    const out = [...dirSegs];
    for (const s of rel.split("/")) {
      if (!s || s === ".") continue;
      if (s === "..") out.pop(); else out.push(s);
    }
    return out.join("/");
  }

  async function ingest(docs) {
    const parsed = [];
    for (const d of docs) {
      let text = null;
      for (let attempt = 0; attempt < 3 && text === null; attempt++) {
        try { text = await (await d.handle.getFile()).text(); }
        catch (e) {
          if (e && e.name === "NotReadableError" && attempt < 2) { await new Promise((r) => setTimeout(r, 150)); continue; }
          console.warn("Bad metadata file", d.path, e); break;
        }
      }
      if (text === null) continue;
      try { parsed.push(normalise(d.path, JSON.parse(text))); }
      catch (e) { console.warn("Bad metadata file", d.path, e); }
    }
    // de-dupe by type+id (same post may appear under several creators only in odd cases)
    const seen = new Set();
    posts = parsed.filter((p) => { const k = `${p.creator}/${p.type}/${p.id}`; if (seen.has(k)) return false; seen.add(k); return true; });
    activeCreator = "";
    renderCreators();
    applyFilters();
  }

  // ---------- filtering ----------
  const controls = ["#type", "#sort", "#has", "#q"];
  controls.forEach((s) => $(s).addEventListener("input", applyFilters));

  function applyFilters() {
    const type = $("#type").value, has = $("#has").value, q = $("#q").value.trim().toLowerCase(), sort = $("#sort").value;
    filtered = posts.filter((p) =>
      (!activeCreator || p.creator === activeCreator) &&
      (!type || p.type === type) &&
      (!has || (has === "photo" && p.hasPhoto) || (has === "video" && p.hasVideo) || (has === "missing" && p.hasMissing) || (has === "locked" && p.hasLocked) || (has === "filtered" && p.hasFiltered) || (has === "failed" && p.hasFailed)) &&
      (!q || p.text.toLowerCase().includes(q) || p.id.includes(q))
    );
    filtered.sort((a, b) => sort === "likes" ? b.likes - a.likes || b.whenMs - a.whenMs : sort === "asc" ? a.whenMs - b.whenMs : b.whenMs - a.whenMs);
    lbItems = [];
    lbIndexByPath.clear();
    for (const p of filtered) for (const m of p.media) if (m.abs && !lbIndexByPath.has(m.abs)) { lbIndexByPath.set(m.abs, lbItems.length); lbItems.push({ abs: m.abs, type: m.type, post: p }); }
    $("#grid").innerHTML = "";
    shown = 0;
    $("#empty").hidden = posts.length > 0;
    renderMore();
    const mediaCount = posts.reduce((n, p) => n + p.media.length, 0);
    const dl = posts.reduce((n, p) => n + p.media.filter((m) => m.abs).length, 0);
    $("#stats").textContent = posts.length ? `${filtered.length} of ${posts.length} posts · ${dl}/${mediaCount} media on disk` : "";
  }

  function renderCreators() {
    const counts = new Map();
    for (const p of posts) counts.set(p.creator, (counts.get(p.creator) || 0) + 1);
    const box = $("#creators");
    box.innerHTML = "";
    const mk = (name, n, value) => {
      const b = document.createElement("button");
      b.className = "creator" + (activeCreator === value ? " active" : "");
      b.innerHTML = `<span>${esc(name)}</span><span class="n">${n}</span>`;
      b.addEventListener("click", () => { activeCreator = value; renderCreators(); applyFilters(); });
      box.appendChild(b);
    };
    mk("All creators", posts.length, "");
    [...counts.entries()].sort((a, b) => b[1] - a[1]).forEach(([c, n]) => mk(c, n, c));
  }

  // ---------- rendering ----------
  $("#loadmore").addEventListener("click", renderMore);
  function renderMore() {
    const slice = filtered.slice(shown, shown + PAGE);
    const frag = document.createDocumentFragment();
    slice.forEach((p) => frag.appendChild(card(p)));
    $("#grid").appendChild(frag);
    shown += slice.length;
    $("#loadmore").hidden = shown >= filtered.length;
  }

  const io = new IntersectionObserver((entries) => {
    for (const en of entries) if (en.isIntersecting) { io.unobserve(en.target); hydrate(en.target); }
  }, { rootMargin: "400px" });

  function card(p) {
    const el = document.createElement("article");
    el.className = "card";
    const date = p.when && !isNaN(p.when) ? p.when.toLocaleString() : "";
    const price = p.isFree === true || !p.price ? "Free" : `$${p.price}`;
    const clamped = p.text.length > 320 || p.text.split("\n").length > 6;
    el.innerHTML = `
      <div class="card-head">
        <span class="who">${esc(p.creatorName || p.creator)}</span>
        <span class="badge ${esc(p.type)}">${esc(p.type)}</span>
        <span class="when" title="${esc(p.path)}">${esc(date)}</span>
      </div>
      ${p.text ? `<div class="text ${clamped ? "clamped" : ""}">${esc(p.text)}</div>${clamped ? `<button class="more">Show more</button>` : ""}` : ""}
      <div class="media ${p.media.length === 1 ? "single" : ""}"></div>
      <div class="meta">
        <span>❤ <b>${p.likes}</b></span>
        <span>💬 <b>${p.comments}</b></span>
        <span><b>${esc(price)}</b></span>
        ${p.tips ? `<span>Tips <b>$${esc(String(p.tips))}</b></span>` : ""}
        <span>${p.media.filter((m) => m.abs).length}/${p.media.length} files</span>
        <span style="margin-left:auto">#${esc(p.id)}</span>
      </div>`;
    const more = el.querySelector(".more");
    if (more) more.addEventListener("click", () => {
      const t = el.querySelector(".text");
      const open = t.classList.toggle("open");
      t.classList.toggle("clamped", !open);
      more.textContent = open ? "Show less" : "Show more";
    });
    const box = el.querySelector(".media");
    for (const m of p.media) {
      const tile = document.createElement("div");
      if (!m.abs) {
        tile.className = "tile missing";
        tile.textContent = m.status === "not_downloaded" ? REASONS[m.reason] || "Not downloaded" : (m.status || "missing");
        tile.title = m.reason ? `${m.status}: ${m.reason}${m.duplicateOfPost ? " (post " + m.duplicateOfPost + ")" : ""}` : m.status;
      } else {
        tile.className = "tile";
        tile.dataset.path = m.abs;
        tile.dataset.type = m.type;
        tile.innerHTML = `<span class="tag">${esc(m.type)}${m.duration ? " · " + fmtDur(m.duration) : ""}</span>`;
        io.observe(tile);
      }
      box.appendChild(tile);
    }
    return el;
  }

  async function hydrate(tile) {
    const file = await resolver(tile.dataset.path);
    if (!file) { tile.classList.add("missing"); tile.textContent = "File not found"; return; }
    const url = objectUrl(tile.dataset.path, file);
    const isVideo = isVideoFile(tile.dataset.type, file.name);
    let node;
    if (isVideo) { node = document.createElement("video"); node.src = url; node.muted = true; node.preload = "metadata"; node.playsInline = true; }
    else { node = document.createElement("img"); node.src = url; node.loading = "lazy"; node.alt = ""; }
    tile.prepend(node);
    tile.addEventListener("click", () => openLightbox(lbIndexByPath.get(tile.dataset.path)));
  }

  // ---------- lightbox ----------
  const lb = $("#lightbox"), lbBody = $("#lightboxBody"), lbCap = $("#lightboxCaption");
  function objectUrl(path, file) {
    let u = urlCache.get(path);
    if (!u) { u = URL.createObjectURL(file); urlCache.set(path, u); }
    return u;
  }
  function isVideoFile(type, name) { return /video|audio/.test(type || "") || /\.(mp4|webm|mov|m4v|m3u8)$/i.test(name || ""); }
  let lbToken = 0;
  async function openLightbox(i) {
    if (typeof i !== "number" || i < 0 || i >= lbItems.length) return;
    lbIndex = i;
    const item = lbItems[i], token = ++lbToken;
    lb.classList.add("open");
    lbCap.innerHTML = `<b>${i + 1} / ${lbItems.length}</b> · ${esc(item.post.creatorName || item.post.creator)} · ${esc(item.post.type)} #${esc(item.post.id)}${item.post.when && !isNaN(item.post.when) ? " · " + esc(item.post.when.toLocaleDateString()) : ""}`;
    const file = await resolver(item.abs);
    if (token !== lbToken) return;
    lbBody.innerHTML = "";
    if (!file) { lbBody.innerHTML = '<p style="color:#bbb">File not found on disk.</p>'; return; }
    const isVideo = isVideoFile(item.type, file.name);
    const node = document.createElement(isVideo ? "video" : "img");
    node.src = objectUrl(item.abs, file);
    if (isVideo) { node.controls = true; node.autoplay = true; }
    lbBody.appendChild(node);
    // warm the neighbours so arrow presses feel instant
    for (const j of [i + 1, i - 1]) if (lbItems[j] && !urlCache.has(lbItems[j].abs)) resolver(lbItems[j].abs).then((f) => f && objectUrl(lbItems[j].abs, f));
  }
  function stepLightbox(d) {
    if (!lb.classList.contains("open") || !lbItems.length) return;
    openLightbox((lbIndex + d + lbItems.length) % lbItems.length);
  }
  function closeLightbox() { lb.classList.remove("open"); lbBody.innerHTML = ""; lbIndex = -1; }
  lb.addEventListener("click", (e) => {
    if (e.target === lb || e.target.classList.contains("close")) closeLightbox();
    else if (e.target.classList.contains("prev")) stepLightbox(-1);
    else if (e.target.classList.contains("next")) stepLightbox(1);
  });
  document.addEventListener("keydown", (e) => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    else if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); stepLightbox(1); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); stepLightbox(-1); }
  });

  // ---------- utils ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function fmtDur(s) { s = Math.round(s); const m = Math.floor(s / 60), r = s % 60; return `${m}:${String(r).padStart(2, "0")}`; }
})();
</script>
